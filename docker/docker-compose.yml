name: hidego-tgbot

services:
  hidego-tgbot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hidego-tgbot
    
    #* Restart policy - revive existing containers after crashes and daemon restarts.
    #* The host watchdog in run.sh handles removed containers/images after prune/down.
    restart: always
    init: true
    stop_grace_period: 45s
    
    #* Health check - marks the container unhealthy when the bot is not ready.
    #* Docker restart policies restart exited containers, not unhealthy ones.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${FASTAPI_PORT:-13360}/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    
    #* Run as host user to avoid ownership issues
    user: "${USER_UID:-1000}:${USER_GID:-1000}"
    
    #* TTY and stdin for manual password entry (optional - only needed without Infisical)
    #* When using Infisical, these can be commented out for cleaner auto-restarts
    #* Uncomment if you need manual password input:
    # tty: true
    # stdin_open: true
    
    #* Environment variables from .env file
    env_file:
      - ../.env
    
    #* Port mapping - use FASTAPI_PORT from .env
    ports:
      - "${FASTAPI_PORT:-13360}:${FASTAPI_PORT:-13360}"
    
    #* Volume mounts for persistent data
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      - ../secret:/app/secret
      - ../diff:/app/diff
      - ../.env:/app/.env:ro
    
    #* Network configuration
    networks:
      - hidego-network
    
    #* Security options
    security_opt:
      - no-new-privileges:true

    #* Prevent Docker json logs from filling the disk and killing the host/daemon.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    
    #* Resource limits
    # deploy:
    #   resources:
    #     limits:
    #       memory: 1G
    #       cpus: '1.0'
    #     reservations:
    #       memory: 512M
    #       cpus: '0.5'

  cloudflared:
    build:
      context: cloudflared
      dockerfile: Dockerfile
    container_name: hidego-cloudflared
    
    #* Restart policy
    restart: always
    init: true
    stop_grace_period: 30s
    
    #* Volume mounts for Cloudflare configuration
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro
    
    #* Network configuration - must be on same network as bot
    networks:
      - hidego-network
    
    #* Depends on bot service
    depends_on:
      - hidego-tgbot
    
    #* Security options
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  hidego-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
