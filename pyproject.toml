[project]
name = "telegram-anonymous-messaging-bot-creator"
description = "HidEgo - Telegram Anonymous Messaging Bot Creator"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [".venv", "repo-mirror.git"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RET", "C4", "ASYNC", "PERF", "RUF"]
ignore = [
    # User-facing strings (incl. Persian text/HTML markup) are intentionally long.
    "E501",
    # Persian/English UI text legitimately uses characters like ‑, ’، etc.
    "RUF001",
    # try/except-inside-loop is intentional for per-item error isolation.
    "PERF203",
]

[tool.ruff.lint.per-file-ignores]
# Markdown-style trailing double-spaces are meaningful in Telegram messages.
"src/utils/responses.py" = ["W291"]

[tool.mypy]
files = ["src"]
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
